# Example profile layer for a profile that keeps the ADDITIVE `devc_*` tools only.
#
# Routing lives in its own profile (see examples/devcontainer.cordis.patch.yml); this one
# stays on the shipped local providers and just gains a few container-aware tools.
#
# There is deliberately NO `mountPoint` / `mountRoot` here, and that is this example's whole
# point.
#
# A stand-in is what makes the workspace picker offer container directories — and a stand-in
# only means something while the routers are mounted. Configure one without `provideFs` /
# `provideShell` and you get the worst of both: the picker offers container paths, the
# registered path is a real but EMPTY local directory, and the workspace registry is shared
# by every profile that has no registry of its own, so the entry turns up in your daily
# profile as a folder that opens to nothing.
#
# Leaving the stand-in unset offers no container picker here at all, and the deployment's own
# chooser handles "Add workspace" exactly as it did before this plugin was installed. The
# client half detects the absent API and steps aside rather than showing a dialog it cannot
# act on.

- id: devcontainer
  config:
    # SSH destination and container, only so the `devc_*` tools know where to reach.
    sshHost: my-nas
    container: my-project-devcontainer
    containerRoot: /workspaces/my-project
    hostRoot: /volume1/docker/my-project
    tools: true
    # No routing in this profile: the routers are mounted only where these are on.
    provideFs: false
    provideShell: false
    provideSearch: false
    prompt: false
    autoWorkspace: false
