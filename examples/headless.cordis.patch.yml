# Example profile layer for a ONE-SHOT verification profile, built from the shipped
# headless template. Same routing configuration as examples/devcontainer.cordis.patch.yml,
# minus the web-server override that only exists in a web profile. This is how you
# regression-test routing through a real agent session without opening a browser:
#
#   dsh --profile dcheadless --from-default-profile headless --dump-config
#   dsh plugin --profile dcheadless add /path/to/dsh-devcontainer
#   cp examples/headless.cordis.patch.yml ~/.dsh/profiles/dcheadless/cordis.patch.yml
#   $EDITOR ~/.dsh/profiles/dcheadless/cordis.patch.yml
#
#   dsh --profile dcheadless "Use your bash tool with workdir <mountPoint> and command \
#     'hostname; test -f /.dockerenv && echo IN_CONTAINER; pwd'. Report it verbatim."

# A DSH workspace must be a real local directory — the registry canonicalizes it with
# node:fs realpath, which never sees the container — so a routing profile necessarily
# registers paths that mean nothing without the routers. Keep them in a registry of this
# profile's own rather than in the shared $DSH_HOME/storages, where they would also appear
# in every other profile and open as empty directories.
- id: storage-json
  config:
    root: !!js dshHomePath('profiles/dcheadless/storages')

# The other half of the same problem. This profile's conversations live at paths that only
# mean anything while the routers are mounted, and the session log root is shared by every
# profile by default — so a conversation started here stayed visible in profiles that cannot
# route it, where, trailing no workspace, it lands in the "Ungrouped" bucket. Isolate the
# log root too, or the workspace disappears from the other profiles while the conversation
# does not.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profiles/dcheadless/sessions')

# Replaced by the routing filesystem provider.
- id: fs-sandbox
  disabled: true

# Replaced by the routing bash executor.
- id: bash-sandbox
  disabled: true

# glob/grep spawn a PACKAGED LOCAL ripgrep through `ctx.subprocess` — see the note in
# examples/devcontainer.cordis.patch.yml.
- id: tool-fs-search
  disabled: true

- id: devcontainer
  config:
    sshHost: my-nas
    container: my-project-devcontainer
    containerRoot: /workspaces/my-project
    hostRoot: /volume1/docker/my-project
    mountPoint: /Users/you/.dsh/devcontainer/my-project
    # A LOCAL directory whose subtree MIRRORS the container's whole filesystem:
    # mountRoot/workspaces/my-project stands for /workspaces/my-project. The container
    # path is recoverable from the mount path by prefix alone, which is what lets the
    # workspace picker offer arbitrary container directories. mountPoint stays as the
    # explicit one-to-one pair for the primary project.
    mountRoot: /Users/you/.dsh/devcontainer/root
    tools: true
    provideFs: true
    provideShell: true
    provideSearch: true
    prompt: true
    autoWorkspace: false
