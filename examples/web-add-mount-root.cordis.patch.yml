# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config overrides,
# disables, and insert lists; `!!js` expressions allowed).
#
# The `devcontainer` row below adds a mount root so the "Add workspace" flow can offer
# directories from inside the dev container. Routing stays OFF in this profile — the
# routing replacements live in their own `devcontainer` profile — so a container workspace
# registered here is an inert local stand-in, and the picker says as much in its dialog.
# Use `dsh --profile devcontainer` to actually work inside the container.

- id: devcontainer
  config:
    sshHost: nas
    container: epic_mirzakhani
    containerRoot: /workspaces/ShutterSeek
    hostRoot: /volume1/docker/ShutterSeek
    # A local subtree that mirrors the container's filesystem, so any container directory
    # can be expressed as a workspace path. Separate from `mountPoint`, which pairs one
    # local directory with the project above.
    mountRoot: /Users/saikewei/.dsh/devcontainer/root
    tools: true
    provideFs: false
    provideShell: false
    provideSearch: false
    prompt: false
    autoWorkspace: false
