# The dsh-devcontainer bundle patch.
#
# One insert over the profile root. The row resolves this same package by name from
# the profile's node_modules, so `dsh plugin add dsh-devcontainer` is the whole
# installation: package plus row, nothing to hand-edit.
#
# These are the TOOLS-ONLY defaults: the devc_* tools are registered and nothing in
# the harness changes. To also route the ordinary bash/read/write/edit/glob/grep seams
# into the container, a profile overrides this row (see README "Routing mode") with
# `provideFs`/`provideShell`/`mountPoint` and disables the `fs-sandbox` and
# `bash-sandbox` rows, which the routers replace.
#
# Address the row by id (`devcontainer`) from your profile cordis.patch.yml to
# override any of its config values; a patch replaces the whole `config` object,
# so restate every key you need rather than only the one you are changing.
#
# Every value below is a PLACEHOLDER. Nothing works until you point it at your own machine,
# which is deliberate: a bundle shipping one operator's host alias, container name and
# project paths would be wrong for everybody else, and would quietly aim their commands at
# a stranger's server. The plugin says so at boot while `sshHost` or `container` is empty.

- insert:
    - id: devcontainer
      name: 'dsh-devcontainer'
      config:
        # An alias from your own ~/.ssh/config. OpenSSH resolves the identity file, port
        # and jump hosts for it, so nothing here needs to know about them.
        sshHost: ''
        # Container name or id on that host. It must already be running.
        container: ''
        # Absolute path inside the container that tools and routed paths default to.
        containerRoot: '/'
        # The same directory as the host sees it, when it is a bind mount. Informational.
        hostRoot: ''
        # A LOCAL directory standing for the container root; configuring it is what enables
        # the workspace picker. Routing mode adds `provideFs`/`provideShell` and disables
        # `fs-sandbox`/`bash-sandbox` — see README "Routing mode".
        mountPoint: ''
        tools: true
        provideFs: false
        provideShell: false
        prompt: false
